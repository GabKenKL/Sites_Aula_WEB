<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    <h1>Exemplo de Tabela</h1>
        <table border="1">

            <tr>
                <th colspan="3">Produtos de Informática</th> <!--Uma célula ocupando mais de uma coluna-->
            </tr>

            <!--<caption>Produto de Informática</caption>-->
            <!--Legenda ou título da tabela-->
            
            <tr> <!--Table row: Linha da tabela-->
                <th>Categoria</th>
                <th>Produto</th> <!--Table header: -->
                <th>Preço</th>
            </tr>

            <tr>
                <td>Computador</td>
                <td>Notebook</td>
                <td>R$ 3.000,00</td> <!--Table data: representa uma célula de dados-->
            </tr>
            <tr>
                <td rowspan="2">Periféricos</td>
                <td>Mouse</td>
                <td>R$ 50,00</td>
            </tr>
            <tr>
                <td>Teclado</td>
                <td>R$ 120,00</td>
            </tr>
        </table>

</body>
</html>
